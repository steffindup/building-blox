# Netlify config for Bloppit (https://bloppit.com; also bloppit.netlify.app).
# The app is plain static HTML in /public (no build step). Every push to main deploys.
# netlify/functions/room holds the "Play together" room server (Netlify Function + Blobs).
[build]
  publish = "public"
  command = ""

# The website is at / and the game at /game/ (it was /build/ until 7 Nov 2026). Play together invites made before the move
# point at /?room=CODE: send those straight into the app.
[[redirects]]
  from = "/"
  to = "/game/?room=:room"
  status = 301
  force = true
  query = {room = ":room"}

# The game moved from /build/ to /game/ (7 Nov 2026). Old links (the App Store listing, posters, shared links, saved
# home-screen icons) keep working: the rest of the address and any ?query come along, and the browser keeps the #page.
[[redirects]]
  from = "/build"
  to = "/game/"
  status = 301
  force = true

[[redirects]]
  from = "/build/*"
  to = "/game/:splat"
  status = 301
  force = true

# Short share links: bloppit.com/join/CODE opens that room (5 characters) or challenge (6 characters) in the app,
# skipping the front page and the menu.
[[redirects]]
  from = "/join/:code"
  to = "/game/?code=:code"
  status = 302
  force = true

# Send the old Netlify address to the real domain, so search engines index one site, not two.
[[redirects]]
  from = "https://bloppit.netlify.app/*"
  to = "https://bloppit.com/:splat"
  status = 301
  force = true

# Keep the room server out of search results.
[[headers]]
  for = "/api/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# The Weekly as data for the app (public/weekly, made by tests/weekly-export.mjs): the app runs from
# capacitor://localhost, so it needs CORS; the data is public anyway. Checked again every few minutes.
[[headers]]
  for = "/weekly/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=300"
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/sound/*"
  [headers.values]
    Content-Type = "audio/mp4"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# Per-channel short links for the November plan: bloppit.com/go/hs, /go/daddit, /go/mommit, /go/act-CODE…
# The app records one "visit:<channel>" count and remembers the channel on the device, so the first finished
# build can be credited to the channel. Nothing identifies the person.
[[redirects]]
  from = "/go/:channel"
  to = "/game/?go=:channel"
  status = 302
  force = true

# Share links: bloppit.com/p/w-2026-10-26 (a Weekly), /p/m-red-boat (a library model), /p/start (the first build).
# The app opens that build with one button, "Build this one". Family Link sends /p/start with an optional
# transfer code (?x=CODE) so a parent's phone can hand the game to the child's device with nothing personal crossing.
[[redirects]]
  from = "/p/:code"
  to = "/game/?p=:code"
  status = 302
  force = true

# The 3D character models (about 10 MB each) and their loader: browsers keep them for a year instead of checking back
# on every visit. Safe because the game always asks for them with a version (bloppit.glb?v=2, GLTFLoader.js?v=2):
# a changed file MUST get a new version number in public/game/index.html (MODEL3's v, or the loader's ?v=),
# or players keep the old one.
[[headers]]
  for = "/3d/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
