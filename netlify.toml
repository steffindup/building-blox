# Netlify config for Bloppit (https://bloppit.com; also bloppit.netlify.app).
# The app is plain static HTML in /public (no build step). Every push to main deploys.
# netlify/functions/room holds the "Play together" room server (Netlify Function + Blobs).
[build]
  publish = "public"
  command = ""

# The landing page is at / and the app at /build/. Play together invites made before the move
# point at /?room=CODE: send those straight into the app.
[[redirects]]
  from = "/"
  to = "/build/?room=:room"
  status = 301
  force = true
  query = {room = ":room"}

# Short share links: bloppit.com/join/CODE opens that room (5 characters) or challenge (6 characters) in the app,
# skipping the front page and the menu.
[[redirects]]
  from = "/join/:code"
  to = "/build/?code=:code"
  status = 302
  force = true

# Send the old Netlify address to the real domain, so search engines index one site, not two.
[[redirects]]
  from = "https://bloppit.netlify.app/*"
  to = "https://bloppit.com/:splat"
  status = 301
  force = true

# Keep the room server out of search results.
[[headers]]
  for = "/api/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
