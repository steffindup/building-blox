# Netlify config for Bloppit (https://bloppit.com; also bloppit.netlify.app).
# The app is plain static HTML in /public (no build step). Every push to main deploys.
# netlify/functions/room holds the "Play together" room server (Netlify Function + Blobs).
[build]
  publish = "public"
  command = ""

# Isolated challenger branch only. The main/production build remains unchanged.
[context."chatgpt/bloppit-challenger"]
  command = "npm ci && node scripts/build-challenger.mjs"
  publish = "challenger-dist"

# The landing page is at / and the app at /build/. Play together invites made before the move
# point at /?room=CODE: send those straight into the app.
[[redirects]]
  from = "/"
  to = "/build/?room=:room"
  status = 301
  force = true
  query = {room = ":room"}

# Short share links: bloppit.com/join/CODE opens that room (5 characters) or challenge (6 characters) in the app,
# skipping the front page and the menu.
[[redirects]]
  from = "/join/:code"
  to = "/build/?code=:code"
  status = 302
  force = true

# Send the old Netlify address to the real domain, so search engines index one site, not two.
[[redirects]]
  from = "https://bloppit.netlify.app/*"
  to = "https://bloppit.com/:splat"
  status = 301
  force = true

# Keep the room server out of search results.
[[headers]]
  for = "/api/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# Per-channel short links for the November plan: bloppit.com/go/hs, /go/daddit, /go/mommit, /go/act-CODE…
# The app records one "visit:<channel>" count and remembers the channel on the device, so the first finished
# build can be credited to the channel. Nothing identifies the person.
[[redirects]]
  from = "/go/:channel"
  to = "/build/?go=:channel"
  status = 302
  force = true

# Share links: bloppit.com/p/w-2026-10-26 (a Weekly), /p/m-red-boat (a library model), /p/start (the first build).
# The app opens that build with one button, "Build this one". Family Link sends /p/start with an optional
# transfer code (?x=CODE) so a parent's phone can hand the game to the child's device with nothing personal crossing.
[[redirects]]
  from = "/p/:code"
  to = "/build/?p=:code"
  status = 302
  force = true
