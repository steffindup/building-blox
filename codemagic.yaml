# Codemagic builds the Bloppit iPhone/iPad app in the cloud (no Mac needed) and uploads it to TestFlight.
# The app's code is in mobile/ (see mobile/README.md). Builds only run when you start one in Codemagic.
#
# One-time setup in Codemagic (codemagic.io), after you've joined the Apple Developer Program:
#  1. Add this GitHub repo (steffindup/building-blox) as an app.
#  2. Team settings > Integrations > Developer Portal: connect an App Store Connect API key and name it "Bloppit ASC".
#  3. In App Store Connect, create the app with bundle ID com.bloppit.app, then copy its "Apple ID" number
#     (App Information page) into APP_STORE_APPLE_ID below.
#  4. Start the "iOS to TestFlight" workflow once by hand. After that, every push to main that changes the
#     app (public/game/ or mobile/) builds it and sends it to TestFlight automatically. Pushes that only
#     change the home page, the room server or other files are skipped, which saves build minutes.
#     If automatic builds don't start: Codemagic > this app > Webhooks > "Update webhook".
workflows:
  ios-testflight:
    name: iOS to TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 45
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true # a newer push replaces a build that's still waiting or running
    when:
      changeset: # only build when the app itself changed (codemagic.yaml always counts too)
        includes:
          - 'public/game/'
          - 'mobile/'
        excludes:
          - '**/*.md'
          - 'mobile/store/'
          - 'mobile/android/'
    integrations:
      app_store_connect: Bloppit ASC
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.bloppit.app
      vars:
        APP_STORE_APPLE_ID: 6821449219 # the app's Apple ID from App Store Connect (App Information page)
        XCODE_PROJECT: mobile/ios/App/App.xcodeproj
        XCODE_SCHEME: App
      node: 22
      xcode: 27.2 # pinned: "latest" has been landing on overloaded build machines. 27.x builds with the iOS 27 SDK: the whole iPhone Duo screen, and Apple requires it from April 2027
    scripts:
      - name: Install and package the web app into the iOS project
        script: |
          cd mobile
          npm ci
          npm run sync
      - name: Set up code signing
        script: xcode-project use-profiles --project "$XCODE_PROJECT"
      - name: Set the version
        script: |
          # The project's version, or the next one once that version has been sent for review (mobile/scripts/release.mjs)
          V=$(node mobile/scripts/release.mjs build-version "$XCODE_PROJECT/project.pbxproj")
          echo "This build is version $V"
          sed -i '' "s/MARKETING_VERSION = [0-9.]*;/MARKETING_VERSION = $V;/g" "$XCODE_PROJECT/project.pbxproj"
      - name: Bump the build number
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = $((LATEST + 1));/g" "$XCODE_PROJECT/project.pbxproj"
      - name: Build the .ipa
        script: xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - steffindup@gmail.com
        notify:
          success: true
          failure: true

  # A release: builds the version named in mobile/store/release.json and sends it to App Store review with that file's
  # What's New text. Apple releases it when it is approved. It starts when a push changes that file and nothing else
  # needs doing in App Store Connect (Steff, 18 Nov 2026: he wants the app to follow the website without the manual
  # steps). How to make a release: mobile/scripts/release.mjs and CLAUDE.md.
  #  - Push the release file as a commit of its own, when no "iOS to TestFlight" build is running: two builds at once
  #    would ask for the same build number.
  #  - A version still waiting for review is left alone unless the file says "replace_waiting": true.
  #  - The key "Bloppit ASC" needs the App Manager role (or Admin) to submit for review.
  ios-release:
    name: iOS to App Store review
    instance_type: mac_mini_m2
    max_build_duration: 75
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    when:
      changeset: # codemagic.yaml always counts too, so the first step checks that the release file itself changed
        includes:
          - 'mobile/store/release.json'
    integrations:
      app_store_connect: Bloppit ASC
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.bloppit.app
      vars:
        APP_STORE_APPLE_ID: 6821449219
        XCODE_PROJECT: mobile/ios/App/App.xcodeproj
        XCODE_SCHEME: App
      node: 22
      xcode: 27.2
    scripts:
      - name: Is this push a release?
        script: |
          if git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -qx 'mobile/store/release.json'; then
            V=$(node mobile/scripts/release.mjs check "$XCODE_PROJECT/project.pbxproj")   # stops the build with the reason if the file can't be sent
            echo "Releasing version $V"
            echo "$V" > /tmp/release-version
          else
            echo "The release file did not change in this commit: nothing to send to Apple."
            touch /tmp/no-release
          fi
      - name: Install and package the web app into the iOS project
        script: |
          if [ -f /tmp/no-release ]; then exit 0; fi
          cd mobile
          npm ci
          npm run sync
      - name: Set up code signing
        script: |
          if [ -f /tmp/no-release ]; then exit 0; fi
          xcode-project use-profiles --project "$XCODE_PROJECT"
      - name: Set the version and the build number
        script: |
          if [ -f /tmp/no-release ]; then exit 0; fi
          V=$(cat /tmp/release-version)
          sed -i '' "s/MARKETING_VERSION = [0-9.]*;/MARKETING_VERSION = $V;/g" "$XCODE_PROJECT/project.pbxproj"
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = $((LATEST + 1));/g" "$XCODE_PROJECT/project.pbxproj"
          echo "Version $V, build $((LATEST + 1))"
      - name: Build the .ipa
        script: |
          if [ -f /tmp/no-release ]; then exit 0; fi
          xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
      - name: Upload it and submit it for App Store review
        script: |
          if [ -f /tmp/no-release ]; then exit 0; fi
          WHATS_NEW="$(node mobile/scripts/release.mjs whats-new)"
          ARGS=(--path build/ios/ipa/*.ipa --app-store --release-type AFTER_APPROVAL --whats-new "$WHATS_NEW" --max-build-processing-wait 40)
          if [ "$(node mobile/scripts/release.mjs replace-waiting)" = "yes" ]; then ARGS+=(--cancel-previous-submissions); fi
          app-store-connect publish "${ARGS[@]}"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - steffindup@gmail.com
        notify:
          success: true
          failure: true

  # Android: builds a signed .aab (Android App Bundle) for Google Play.
  # One-time setup (see mobile/store/google-play.md):
  #  1. Codemagic > Team settings > codemagic.yaml settings > Code signing identities > Android keystores:
  #     upload bloppit-upload.jks with its passwords and alias, reference name "bloppit_upload".
  #  2. Start "Android for Google Play" once by hand. The email has the .aab to download: upload that first one to
  #     Play Console yourself (Google requires the first upload by hand).
  #  3. Later, to send builds to Google Play automatically: make a Google Cloud service account with access to the
  #     app in Play Console, put its JSON key in an environment group "google_play" as GCLOUD_SERVICE_ACCOUNT_CREDENTIALS,
  #     then switch on the two commented blocks below (triggering and google_play publishing).
  # A test build on Xcode 27 (19 Nov 2026): runs only for pushes to the branch xcode-27, builds the .ipa and sends it
  # nowhere (no TestFlight, no review), so it can be tried while 1.1.6 is still to be released on Xcode 26.5.
  ios-xcode27-check:
    name: iOS build check on Xcode 27 (not uploaded)
    instance_type: mac_mini_m2
    max_build_duration: 45
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: xcode-27
          include: true
          source: true
      cancel_previous_builds: true
    integrations:
      app_store_connect: Bloppit ASC
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.bloppit.app
      vars:
        XCODE_PROJECT: mobile/ios/App/App.xcodeproj
        XCODE_SCHEME: App
      node: 22
      xcode: 27.2
    scripts:
      - name: Install and package the web app into the iOS project
        script: |
          cd mobile
          npm ci
          npm run sync
      - name: Set up code signing
        script: xcode-project use-profiles --project "$XCODE_PROJECT"
      - name: Build the .ipa
        script: xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - steffindup@gmail.com
        notify:
          success: false
          failure: true

  android-play:
    name: Android for Google Play
    instance_type: linux_x2
    max_build_duration: 45
    # triggering:                # switch on once Google Play publishing works (same rules as iOS)
    #   events:
    #     - push
    #   branch_patterns:
    #     - pattern: main
    #       include: true
    #       source: true
    #   cancel_previous_builds: true
    # when:
    #   changeset:
    #     includes:
    #       - 'public/game/'
    #       - 'mobile/'
    #     excludes:
    #       - '**/*.md'
    #       - 'mobile/store/'
    #       - 'mobile/ios/'
    environment:
      android_signing:
        - bloppit_upload
      # groups:
      #   - google_play            # GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
      vars:
        PACKAGE_NAME: com.bloppit.app
        VERSION_NAME: "1.1.7"    # keep in step with the iOS MARKETING_VERSION
      node: 22
      java: 21
    scripts:
      - name: Install and package the web app into the Android project
        script: |
          cd mobile
          npm ci
          npm run sync:android
      - name: Build the signed .aab
        script: |
          cd mobile/android
          chmod +x gradlew
          # versionCode must rise with every upload: Codemagic's build number does
          ./gradlew bundleRelease -PversionCode=$BUILD_NUMBER -PversionName=$VERSION_NAME
    artifacts:
      - mobile/android/app/build/outputs/bundle/release/*.aab
      - mobile/android/app/build/outputs/mapping/release/mapping.txt
    publishing:
      # google_play:
      #   credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
      #   track: alpha               # closed testing (the 12-tester fortnight); "production" once it's done
      #   submit_as_draft: true      # while the app is still a draft in Play Console
      email:
        recipients:
          - steffindup@gmail.com
        notify:
          success: true
          failure: true
