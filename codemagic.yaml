# Codemagic builds the Bloppit iPhone/iPad app in the cloud (no Mac needed) and uploads it to TestFlight.
# The app's code is in mobile/ (see mobile/README.md). Builds only run when you start one in Codemagic.
#
# One-time setup in Codemagic (codemagic.io), after you've joined the Apple Developer Program:
#  1. Add this GitHub repo (steffindup/building-blox) as an app.
#  2. Team settings > Integrations > Developer Portal: connect an App Store Connect API key and name it "Bloppit ASC".
#  3. In App Store Connect, create the app with bundle ID com.bloppit.app, then copy its "Apple ID" number
#     (App Information page) into APP_STORE_APPLE_ID below.
#  4. Start the "iOS to TestFlight" workflow once by hand. After that, every push to main that changes the
#     app (public/build/ or mobile/) builds it and sends it to TestFlight automatically. Pushes that only
#     change the home page, the room server or other files are skipped, which saves build minutes.
#     If automatic builds don't start: Codemagic > this app > Webhooks > "Update webhook".
workflows:
  ios-challenger:
    name: Bloppit Lab - separate TestFlight app (manual)
    instance_type: mac_mini_m2
    max_build_duration: 45
    integrations:
      app_store_connect: Bloppit ASC
    environment:
      groups:
        - bloppit_challenger
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.bloppit.challenger
      node: 22
      xcode: 26.5
    scripts:
      - name: Verify separate App Store record
        script: |
          case "$CHALLENGER_APPLE_ID" in
            ''|*[!0-9]*|6821449219) echo "Set CHALLENGER_APPLE_ID to a separate Bloppit Lab app record."; exit 1 ;;
          esac
      - name: Package offline challenger and create its own iOS project
        script: |
          npm ci
          node scripts/build-challenger-mobile.mjs
          cd mobile-challenger
          npm ci
          npx cap add ios
          npx cap sync ios
      - name: Sign only the challenger project
        script: xcode-project use-profiles --project mobile-challenger/ios/App/App.xcodeproj
      - name: Assign a separate build number
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$CHALLENGER_APPLE_ID" || echo 0)
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = $((LATEST + 1));/g" mobile-challenger/ios/App/App.xcodeproj/project.pbxproj
      - name: Build Bloppit Lab
        script: xcode-project build-ipa --project mobile-challenger/ios/App/App.xcodeproj --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
  ios-testflight:
    name: iOS to TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 45
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true # a newer push replaces a build that's still waiting or running
    when:
      changeset: # only build when the app itself changed (codemagic.yaml always counts too)
        includes:
          - 'public/build/'
          - 'mobile/'
        excludes:
          - '**/*.md'
          - 'mobile/store/'
    integrations:
      app_store_connect: Bloppit ASC
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.bloppit.app
      vars:
        APP_STORE_APPLE_ID: 6821449219 # the app's Apple ID from App Store Connect (App Information page)
        XCODE_PROJECT: mobile/ios/App/App.xcodeproj
        XCODE_SCHEME: App
      node: 22
      xcode: 26.5 # pinned: "latest" has been landing on overloaded build machines
    scripts:
      - name: Install and package the web app into the iOS project
        script: |
          cd mobile
          npm ci
          npm run sync
      - name: Set up code signing
        script: xcode-project use-profiles --project "$XCODE_PROJECT"
      - name: Bump the build number
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = $((LATEST + 1));/g" "$XCODE_PROJECT/project.pbxproj"
      - name: Build the .ipa
        script: xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - steffindup@gmail.com
        notify:
          success: true
          failure: true
